<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeñorTendero - Ingreso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="antialiased flex items-center justify-center p-4 min-h-screen">

  <main class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-3xl p-8 shadow-xl shadow-slate-200/50 border border-slate-100 fade-in">
    
    <div class="text-center mb-6">
      <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">🛒 SeñorTendero</span>
      <h1 class="text-2xl font-extrabold text-slate-900 mt-2">Iniciar Sesión</h1>
      <p class="text-xs text-slate-500">Ingresa tus datos o accede como vendedor</p>
    </div>

    <!-- Formulario de Login -->
    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tu Nombre (Si eres cliente)</label>
        <input type="text" id="nombre-ingresado" placeholder="Ej: Doña María o Familia Pérez" class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Usuario</label>
        <input type="text" id="usuario" placeholder="Ej: perez01 o tendero" required class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Contraseña / Clave Única</label>
        <input type="password" id="password" placeholder="••••••••" required class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-blue-500/25 transition text-sm">
        Ingresar a mi Cuenta
      </button>
    </form>

    <p id="error-msg" class="text-xs text-red-500 text-center mt-4 font-medium hidden"></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>

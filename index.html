<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeñorTendero - Acceso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="antialiased flex items-center justify-center p-4">

  <main class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-3xl p-8 shadow-xl shadow-slate-200/50 border border-slate-100 fade-in">
    
    <div class="text-center mb-6">
      <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">🇨🇴 SeñorTendero</span>
      <h1 class="text-2xl font-extrabold text-slate-900 mt-2">Bienvenido</h1>
      <p class="text-xs text-slate-500">Inicia sesión según tu rol</p>
    </div>

    <!-- Pestañas de Selección -->
    <div class="flex mb-6 bg-slate-100 p-1 rounded-xl">
      <button id="tab-login" onclick="cambiarTab('login')" class="flex-1 py-2 rounded-lg font-semibold text-xs bg-blue-600 text-white shadow transition">Iniciar Sesión</button>
      <button id="tab-registro" onclick="cambiarTab('registro')" class="flex-1 py-2 rounded-lg font-semibold text-xs text-slate-600 transition">Registro Cliente</button>
    </div>

    <!-- Formulario -->
    <form id="form-auth" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Correo Electrónico</label>
        <input type="email" id="email" placeholder="correo@ejemplo.com" required class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none">
      </div>

      <button type="submit" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-blue-500/25 transition text-sm">
        Ingresar
      </button>
    </form>

    <p id="error-msg" class="text-xs text-red-500 text-center mt-4 font-medium hidden"></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>

<footer class="text-center py-6 text-xs text-slate-400">

</footer>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SeñorTendero - Iniciar Sesión</title>
  
  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html, body {
      overflow-x: hidden;
      max-width: 100vw;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

  <div class="max-w-md w-full mx-auto p-6 my-auto">
    <div class="text-center mb-8">
      <div class="inline-flex p-3 bg-blue-600 text-white rounded-2xl shadow-lg mb-3">
        <i data-lucide="store" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-800">SeñorTendero</h1>
      <p class="text-sm text-slate-500">Gestión de cuentas y fiados de barrio</p>
    </div>

    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre (Opcional si eres cliente)</label>
          <input type="text" id="nombre-ingresado" placeholder="Ej. Doña Mafe" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Usuario</label>
          <input type="text" id="usuario" required placeholder="Tu usuario asignado" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        
        <div id="error-msg" class="hidden text-xs text-red-500 font-semibold text-center bg-red-50 p-2 rounded-lg"></div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-md">
          Ingresar al Sistema
        </button>
      </form>
    </div>
  </div>

  <footer class="text-center py-4 text-xs text-slate-400">
    SeñorTendero © 2026 • Hecho para tiendas de barrio
  </footer>

  <script type="module" src="app.js"></script>
  <script>
    if (typeof lucide !== 'undefined') { lucide.createIcons(); }
  </script>
</body>
</html>

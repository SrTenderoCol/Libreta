<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Cuenta - SeñorTendero</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

  <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="p-2 bg-blue-600 text-white rounded-xl">
        <i data-lucide="book-open" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-slate-800 text-base" id="nombre-cliente-saludo">Bienvenido</h1>
        <p class="text-xs text-slate-400">Consulta tu libreta de cuenta</p>
      </div>
    </div>
    <button id="btn-logout" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold px-3 py-2 rounded-xl transition border border-rose-200">
      Cerrar Sesión
    </button>
  </header>

  <main class="max-w-2xl w-full mx-auto p-4 md:p-6 space-y-6 my-auto">

    <div class="bg-blue-600 text-white p-6 rounded-2xl shadow-md flex justify-between items-center">
      <div>
        <p class="text-xs text-blue-100 uppercase tracking-wider font-semibold">Mi cuenta</p>
        <h2 class="text-lg font-black mt-1">Saldo pendiente</h2>
      </div>
      <span id="mi-deuda" class="text-3xl font-black">$0</span>
    </div>

    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
      <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Último movimiento</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="border-b text-xs text-slate-400 uppercase">
              <th class="pb-2">Fecha</th>
              <th class="pb-2">Detalle</th>
              <th class="pb-2 text-right">Valor</th>
            </tr>
          </thead>
          <tbody id="tabla-cliente">
            <tr><td colspan="3" class="py-4 text-center text-xs text-slate-400">Cargando tu cuenta...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-100">
    SeñorTendero © 2026 • Creado para gestión limpia de deudas
  </footer>

  <script type="module" src="app.js"></script>
  <script>
    if (typeof lucide !== 'undefined') { lucide.createIcons(); }
  </script>
</body>
</html>
